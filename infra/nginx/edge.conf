server {
  listen 8080;
  server_tokens off;
  client_max_body_size 20m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  resolver 127.0.0.11 valid=10s ipv6=off;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;
  proxy_read_timeout 90s;
  location = /health { access_log off; return 200 'ok'; }
  location ^~ /internal { return 404; }
  location ^~ /api/platform/ { set $upstream http://platform-api:3101; proxy_pass $upstream$request_uri; }
  location ^~ /api/finance/ { set $upstream http://finance-api:3102; proxy_pass $upstream$request_uri; }
  location /api/ { return 404; }
  location /micro/finance/ { set $upstream http://finance-web:8080; rewrite ^/micro/finance/(.*)$ /$1 break; proxy_pass $upstream$uri$is_args$args; }
  location /micro/sample/ { set $upstream http://sample-web:8080; rewrite ^/micro/sample/(.*)$ /$1 break; proxy_pass $upstream$uri$is_args$args; }
  location /micro/ { return 404; }
  location / { set $upstream http://portal-web:8080; proxy_pass $upstream$request_uri; }
}
