name: Specification and application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  preparation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run db:generate
      - run: npm run check
      - run: npm run auth:delivery-check
      - run: npm run typecheck
      - run: npm run test:finance-rules
      - run: npm run build:portal
      - run: npm run build:finance
      - run: npm run build:sample
      - run: npm run build:poc
      - run: npx playwright install --with-deps chromium
      - run: npm run test:poc
